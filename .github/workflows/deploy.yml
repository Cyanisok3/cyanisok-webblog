name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cyanisok-webblog-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy web blog
    runs-on: [self-hosted, linux, x64, cyanisok-webblog]

    steps:
      - name: Prepare exact source revision
        run: |
          set -euo pipefail

          deploy_root="/home/ubuntu/cyanisok-webblog"
          release_dir="$deploy_root/releases/$GITHUB_SHA-$GITHUB_RUN_ATTEMPT"
          archive="$RUNNER_TEMP/cyanisok-webblog-$GITHUB_SHA.tar.gz"

          mkdir -p "$release_dir"
          curl -fsSL --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            -o "$archive" \
            "https://codeload.github.com/Cyanisok3/cyanisok-webblog/tar.gz/$GITHUB_SHA"
          tar xzf "$archive" --strip-components=1 -C "$release_dir"
          rm "$archive"

          test -f "$release_dir/package-lock.json"
          test -f "$release_dir/.github/workflows/deploy.yml"

      - name: Build, verify, and publish
        run: |
          set -euo pipefail

          deploy_root="/home/ubuntu/cyanisok-webblog"
          release_dir="$deploy_root/releases/$GITHUB_SHA-$GITHUB_RUN_ATTEMPT"
          node_version="22.22.0"
          node_dir="/home/ubuntu/.local/node-v$node_version-linux-x64"
          node_archive="$RUNNER_TEMP/node-v$node_version-linux-x64.tar.xz"

          if [[ ! -x "$node_dir/bin/node" ]]; then
            curl -fsSL --retry 5 --retry-all-errors \
              --connect-timeout 20 --max-time 300 \
              -o "$node_archive" \
              "https://nodejs.org/dist/v$node_version/node-v$node_version-linux-x64.tar.xz"
            echo "9aa8e9d2298ab68c600bd6fb86a6c13bce11a4eca1ba9b39d79fa021755d7c37  $node_archive" | sha256sum -c -
            mkdir -p /home/ubuntu/.local
            tar xJf "$node_archive" -C /home/ubuntu/.local
            rm "$node_archive"
          fi

          export PATH="$node_dir/bin:$PATH"
          cd "$release_dir"

          lock_file="/tmp/cyanisok-webblog-deploy.lock"
          exec 9>"$lock_file"
          flock -w 1800 9

          npm ci
          npm run build

          previous_release="$(readlink -f "$deploy_root/current" || true)"
          ln -sfn "$release_dir" "$deploy_root/current"
          sudo install -m 0644 deploy/systemd/cyanisok-webblog.service /etc/systemd/system/cyanisok-webblog.service
          sudo systemctl daemon-reload
          sudo systemctl enable cyanisok-webblog >/dev/null
          docker rm -f cyan-field-notes >/dev/null 2>&1 || true
          sudo systemctl restart cyanisok-webblog

          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null &&
               curl -fsS http://127.0.0.1:3001/blog >/dev/null &&
               curl -fsS http://127.0.0.1:3001/blog/mdx-writing-guide >/dev/null; then
              break
            fi
            if [[ "$attempt" == "45" ]]; then
              sudo journalctl -u cyanisok-webblog -n 200 --no-pager
              if [[ -n "$previous_release" && -d "$previous_release" ]]; then
                ln -sfn "$previous_release" "$deploy_root/current"
                sudo systemctl restart cyanisok-webblog
              else
                sudo systemctl stop cyanisok-webblog
              fi
              exit 1
            fi
            sleep 2
          done

          nginx_source="deploy/nginx/cyanisok.cn.conf"
          nginx_target="/www/server/panel/vhost/nginx/cyanisok.cn.conf"
          nginx_backup="/tmp/cyanisok-webblog-nginx-backup.$$"

          reload_nginx() {
            if command -v systemctl >/dev/null 2>&1 &&
               sudo systemctl is-active --quiet nginx; then
              sudo systemctl reload nginx
              return
            fi

            sudo nginx -s reload
          }

          sudo cp "$nginx_target" "$nginx_backup"
          sudo install -m 0644 "$nginx_source" "$nginx_target"

          if ! sudo nginx -t; then
            sudo install -m 0644 "$nginx_backup" "$nginx_target"
            sudo rm -f "$nginx_backup"
            exit 1
          fi

          if ! reload_nginx; then
            sudo install -m 0644 "$nginx_backup" "$nginx_target"
            sudo nginx -t
            reload_nginx
            sudo rm -f "$nginx_backup"
            exit 1
          fi

          sudo rm -f "$nginx_backup"
          curl -kfsS https://127.0.0.1/ -H "Host: cyanisok.cn" >/dev/null
          sudo systemctl --no-pager --full status cyanisok-webblog
